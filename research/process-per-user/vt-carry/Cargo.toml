# Isolated checkpoint candidate; no application dependency selects it yet.
[package]
name = "infraternal-vt-carry"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[features]
default = ["std"]
std = ["memchr/std"]

[dependencies]
arrayvec = { version = "=0.7.8", default-features = false }
