# Measurement tool for the head-to-head kit (research/head-to-head, #260).
# Standalone: not a workspace member and never linked into infraternal.
[package]
name = "h2h"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
# The shipping wire codec, so the native client speaks exactly what the browser speaks.
infraternal-protocol = { path = "../../../../crates/infraternal-protocol" }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hkdf = "0.12"
libc = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
