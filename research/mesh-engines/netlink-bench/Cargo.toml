# Role: Standalone research harness for Linux WireGuard Generic Netlink control.
[package]
name = "mesh-engines-netlink-bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
netlink-bindings = { version = "0.3.5", features = ["wireguard"] }
netlink-socket2 = "0.3.5"
nl-wireguard = "0.3.0"
nlink = { version = "0.29.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
nlink-bench = ["dep:nlink"]

[[bin]]
name = "mesh-engines-netlink-bench"
path = "src/main.rs"

[[bin]]
name = "mesh-engines-netlink-minimal-bench"
path = "src/bin/minimal.rs"

[[bin]]
name = "mesh-engines-netlink-nlink-bench"
path = "src/bin/nlink_bench.rs"
required-features = ["nlink-bench"]
