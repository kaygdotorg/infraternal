# Fuzzes frozen shim/wire framing plus remote CSR and writer binding admission [12][40].
[package]
name = "infraternal-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
serde_json.workspace = true
infraternal-plugin-ssh = { version = "0.1.0", path = "../crates/plugins/ssh" }
libfuzzer-sys.workspace = true
infraternal-shim.workspace = true
infraternal-protocol.workspace = true
infraternal-agent = { version = "0.1.0", path = "../crates/infraternal-agent" }
infraternal-server = { version = "0.1.0", path = "../crates/infraternal-server" }

[[bin]]
name = "shim_frame_decode"
path = "fuzz_targets/shim_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_frame_decode"
path = "fuzz_targets/wire_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_stream_decode"
path = "fuzz_targets/wire_stream_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_csr_decode"
path = "fuzz_targets/remote_csr_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_binding_decode"
path = "fuzz_targets/remote_binding_decode.rs"
test = false
doc = false
bench = false

# Fuzz targets are the one place where unwrap and expect are the point: a panic
# is how libFuzzer reports a broken invariant (for example, a failed round trip).
# Cargo cannot override one inherited lint, so the policy is repeated here.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"

[[bin]]
name = "ssh_check_decode"
path = "fuzz_targets/ssh_check_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_public_config_decode"
path = "fuzz_targets/ssh_public_config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_host_record_parse"
path = "fuzz_targets/ssh_host_record_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_auth_once_decode"
path = "fuzz_targets/ssh_auth_once_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_facts_request"
path = "fuzz_targets/native_facts_request.rs"
test = false
doc = false
bench = false
