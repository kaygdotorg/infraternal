# Decoder fuzzing harness for both parsers of untrusted bytes [12][40]:
# the frozen shim framing (contracts/shim.md) and the wire codec (contracts/wire.md).
[package]
name = "infraternal-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
serde_json.workspace = true
infraternal-plugin-ssh = { version = "0.1.0", path = "../crates/plugins/ssh" }
infraternal-agent = { version = "0.1.0", path = "../crates/infraternal-agent", default-features = false, features = ["remote"] }
infraternal-server = { version = "0.1.0", path = "../crates/infraternal-server", default-features = false, features = ["remote"] }
libfuzzer-sys.workspace = true
infraternal-plugin-api.workspace = true
infraternal-shim.workspace = true
infraternal-protocol.workspace = true
infraternal-plugin-host-facts = { version = "0.1.0", path = "../crates/plugins/host-facts" }
infraternal-plugin-mesh = { version = "0.1.0", path = "../crates/plugins/mesh", default-features = false, features = ["server"] }

[[bin]]
name = "shim_frame_decode"
path = "fuzz_targets/shim_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_frame_decode"
path = "fuzz_targets/wire_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_stream_decode"
path = "fuzz_targets/wire_stream_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_facts_decode"
path = "fuzz_targets/host_facts_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh_api_json"
path = "fuzz_targets/mesh_api_json.rs"
test = false
doc = false
bench = false

# Fuzz targets are the one place where unwrap and expect are the point: a panic
# is how libFuzzer reports a broken invariant (for example, a failed round trip).
# Cargo cannot override one inherited lint, so the policy is repeated here.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"

[[bin]]
name = "remote_csr_decode"
path = "fuzz_targets/remote_csr_decode.rs"
test = false
doc = false
bench = false


