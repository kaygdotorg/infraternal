<!-- Minimal static shell for the S1 tracer client; auth and terminal views mount in #app. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101113" id="theme-color" />
    <title>infraternal</title>
    <!-- App icons (owner-supplied, 2026-11-14): the tab follows the system scheme; the home-screen icon is the dark variant. -->
    <link rel="icon" href="./icons/light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./icons/dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icons/dark-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/maple-mono-nf/roman.latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./ui.css" />
    <link rel="stylesheet" href="./auth.css" />
    <link rel="stylesheet" href="./canvas.css" />
    <link rel="stylesheet" href="./clusters.css" />
    <link rel="stylesheet" href="./mesh.css" />
    <link rel="stylesheet" href="./sessions.css" />
    <link rel="stylesheet" href="./addhost.css" />
  </head>
  <body>
    <!-- No interim "loading" text: the page stays a calm empty surface for the few
         milliseconds before the sign-in screen mounts. If the script fails to start,
         a quiet message explains it instead of an endless loading state. -->
    <canvas id="faulty-field" aria-hidden="true"></canvas>
    <main id="app" aria-live="polite"></main>
    <noscript><p class="boot-error">infraternal needs JavaScript.</p></noscript>
    <script>
      addEventListener("error", function () {
        var app = document.getElementById("app");
        if (app && !app.firstChild) app.innerHTML = '<p class="boot-error">infraternal could not start. Reload, and if it persists, check the browser console.</p>';
      }, { once: true });
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
