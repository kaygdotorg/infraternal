# License, advisory, source, and duplicate-version policy for the Rust graph.
[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "MIT",
    # LLVM libFuzzer: permissive and AGPL-compatible, harness only.
    "NCSA",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
