# License, advisory, source, and duplicate-version policy for the Rust graph.
[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ring is the binary's one crypto library (D289 rejected AWS-LC as a second one). A dependency
# that defaults to AWS-LC must be built with its ring backend.
deny = [
    { crate = "aws-lc-rs", reason = "D289: ring is the only crypto library" },
    { crate = "aws-lc-sys", reason = "D289: ring is the only crypto library" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "MIT",
    # LLVM libFuzzer: permissive and AGPL-compatible, harness only.
    "NCSA",
    "Unicode-3.0",
    # WebAuthn uses MPL-2.0 with secondary GNU licenses; BIP-39 is CC0.
    # BSD-2-Clause, BSD-3-Clause and Zlib are permissive transitive dependency licenses.
    "MPL-2.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    # The decided quinn stack uses the permissive rustls-ring provider.
    "ISC",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kaygdotorg/gotatun"]
