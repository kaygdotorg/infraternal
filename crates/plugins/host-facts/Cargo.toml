# The shared, low-cost host facts plugin used by embedded and remote agents.
[package]
name = "infraternal-plugin-host-facts"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["agent"]
agent = []

[dependencies]
infraternal-plugin-api = { path = "../../infraternal-plugin-api", version = "0.1.0" }
nix.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7.1"

[dev-dependencies]
infraternal-protocol = { path = "../../infraternal-protocol", version = "0.1.0" }

[[example]]
name = "host_facts_measure"
path = "examples/measure.rs"

[lints]
workspace = true
