# Removable server release settings and verified channel lookup [198,201,226].
[package]
name = "infraternal-plugin-release"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]
server = ["infraternal-plugin-api/socket-host", "dep:sha2", "dep:bytes", "dep:infraternal-protocol", "dep:sqlx", "dep:tokio", "dep:uuid", "dep:nix", "dep:tracing", "dep:tar"]

[dependencies]
infraternal-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes = { workspace = true, optional = true }
infraternal-protocol = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
uuid = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Reads the signed web build archive of a release (#211 S6); already used by the proxy plugin.
tar = { version = "0.4", optional = true }

[lints]
workspace = true
