# The first-party SSH plugin crate for host access and SSH sessions.
[package]
name = "infraternal-plugin-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
infraternal-plugin-api.workspace = true
infraternal-shim.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs"] }
url.workspace = true
uuid.workspace = true
zeroize = "1.9"

[dev-dependencies]
infraternal-plugin-remote = { path = "../remote", version = "0.1.0", default-features = false, features = ["agent"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
