# The first-party SSH plugin crate for host access and SSH sessions.
[package]
name = "infraternal-plugin-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The signed first-prompt image shares the installed host's terminal dispatcher.
session-bridge = ["dep:infraternal-agent"]

[dependencies]
infraternal-agent = { path = "../../infraternal-agent", version = "0.1.0", default-features = false, optional = true }
infraternal-plugin-api.workspace = true
infraternal-shim = { workspace = true, features = ["async-fd"] }
nix = { workspace = true, features = ["uio"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs"] }
url.workspace = true
uuid.workspace = true
zeroize = "1.9"

# The unreaped exit check uses kqueue where waitid(WNOWAIT) is absent (child_exit.rs).
[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["event"] }

[dev-dependencies]
infraternal-plugin-remote = { path = "../remote", version = "0.1.0", default-features = false, features = ["agent"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
