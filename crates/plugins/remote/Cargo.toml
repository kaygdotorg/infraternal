# Build-removable remote host transport, using the owner-selected engines [198], #78.
[package]
name = "infraternal-plugin-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Unreliable plugin media routing is opt-in; QUIC terminal streams stay in transport.
native-streams = ["transport", "infraternal-plugin-api/native-streams"]
default = []
transport = ["infraternal-plugin-api/native-wire", "dep:ring", "dep:zeroize", "dep:bytes", "dep:openssl", "dep:tokio-openssl", "dep:quinn", "dep:rustls", "dep:tokio", "dep:serde", "dep:serde_json", "dep:infraternal-protocol", "dep:uuid"]
agent = ["transport", "dep:infraternal-shim", "dep:nix", "nix/net"]
server = ["transport", "infraternal-plugin-api/socket-host"]
test-support = ["transport", "native-streams"]

[dependencies]
ring = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["net"] }
infraternal-plugin-api = { path = "../../infraternal-plugin-api", version = "0.1.0" }
infraternal-protocol = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Virtual clocks test probe scheduling without measuring host wall time.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Existing managed-service uninstall speaks to the Linux terminal shim only.
infraternal-shim = { workspace = true, optional = true }

[lints]
workspace = true
