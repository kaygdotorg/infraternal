# Mesh coordinator and future node component share one removable plugin [198,201].
[package]
name = "infraternal-plugin-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]
server = ["dep:uuid"]
ee = []
agent = ["dep:nix", "dep:openssl", "dep:zeroize"]

[dependencies]
infraternal-plugin-api.workspace = true
infraternal-protocol.workspace = true
infraternal-mesh = { version = "0.1.0", path = "../../infraternal-mesh" }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true

nix = { workspace = true, optional = true, features = ["net"] }
openssl = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[lints]
workspace = true
