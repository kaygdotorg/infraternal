# Mesh coordinator and future node component share one removable plugin [198,201].
[package]
name = "infraternal-plugin-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]
server = ["dep:uuid", "dep:tracing"]
ee = []
# Diagnostic stage logging is removable and never enabled by a shipping role.
cutoff-measure = ["nix?/time"]
agent = ["dep:nix", "dep:openssl", "dep:zeroize"]
# Relayed pairs through the seam C shim and relay address observation [313].
relay = ["agent", "dep:socket2", "dep:infraternal-plugin-relay", "infraternal-plugin-relay/runtime"]
# Kernel timestamp precision is used by opt-in transport measurement fixtures only.
test-support = ["agent", "infraternal-plugin-relay?/test-support"]
# Default-off resolver prototype until DNS integration is enabled [#266].
mesh-dns-spike = ["agent", "server", "dep:hickory-proto", "dep:url"]

[dependencies]
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-protocol.workspace = true
infraternal-mesh = { version = "0.1.0", path = "../../infraternal-mesh" }
infraternal-plugin-relay = { version = "0.1.0", path = "../relay", optional = true }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }

nix = { workspace = true, optional = true, features = ["net"] }
# Already in the binary through tokio with these features; used for the seam's
# raw send socket and its classic BPF packet tap [313].
socket2 = { version = "0.6", optional = true, features = ["all"] }
openssl = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
hickory-proto = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true

# The production-schema proof needs coordinator storage, never an agent-only build.
[[example]]
name = "coordinator_fixture"
required-features = ["server"]

# Namespace fixture for the seam C relay proof (scripts/mesh-relay-proof.py).
[[example]]
name = "relay_fixture"
required-features = ["relay", "test-support"]
