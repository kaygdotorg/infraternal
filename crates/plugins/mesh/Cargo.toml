# Mesh coordinator and future node component share one removable plugin [198,201].
[package]
name = "infraternal-plugin-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]
server = ["dep:uuid", "dep:tracing", "dep:url"]
ee = []
# Diagnostic stage logging is removable and never enabled by a shipping role.
cutoff-measure = ["nix?/time"]
agent = [
    "dep:nix",
    "dep:openssl",
    "dep:zeroize",
    "dep:gotatun",
    "dep:ipnetwork",
    "dep:security-framework",
    "dep:tracing",
    "dep:gotatun-fork",
    "dep:infraternal-linux-tun",
    "tokio/rt-multi-thread",
]
# Relayed pairs through the seam C shim and relay address observation [313].
relay = ["agent", "dep:socket2", "dep:infraternal-plugin-relay", "infraternal-plugin-relay/runtime", "infraternal-mesh/relay"]
# In-memory relay credentials are used by isolated protocol and namespace fixtures.
test-support = ["agent", "infraternal-plugin-relay?/test-support"]
# Default-off resolver prototype until DNS integration is enabled [#266].
mesh-dns-spike = ["agent", "server", "dep:hickory-proto", "dep:url"]

[dependencies]
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-protocol.workspace = true
infraternal-mesh = { version = "0.1.0", path = "../../infraternal-mesh" }
infraternal-linux-tun = { version = "0.1.0", path = "../../infraternal-linux-tun", optional = true }
infraternal-plugin-relay = { version = "0.1.0", path = "../relay", optional = true }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }

nix = { workspace = true, optional = true, features = ["net", "ioctl"] }
# Already in the binary through tokio with these features; used for the seam's
# raw send socket and its classic BPF packet tap [313].
socket2 = { version = "0.6", optional = true, features = ["all"] }
openssl = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
hickory-proto = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Ring here too, so the Mac node builds GotaTun without AWS-LC (D289).
gotatun = { version = "0.10.2", default-features = false, features = ["device", "ring"], optional = true }
ipnetwork = { version = "0.21.1", optional = true }
security-framework = { version = "3.7.0", optional = true }

# Linux nodes run GotaTun from our fork, pinned by commit (D163); the Mac node uses the release
# (#265). One dependency name cannot have a different source per target, so the fork has its own
# name here and the crate root restores the `gotatun` path for the Linux code.
[target.'cfg(target_os = "linux")'.dependencies]
# The ring backend: ring is the binary's one crypto library (D289); GotaTun defaults to AWS-LC.
gotatun-fork = { package = "gotatun", version = "0.10.2", git = "https://github.com/kaygdotorg/gotatun", rev = "73eb9f1ae185313609d031c644cb4a81f3c927dc", default-features = false, features = ["device", "ring"], optional = true }
ipnetwork = { version = "0.21.1", optional = true }

[dev-dependencies]
# Namespace tests run each node on a thread that entered its own network namespace (D332).
nix = { workspace = true, features = ["net", "sched"] }

[lints]
workspace = true

# The production-schema proof needs coordinator storage, never an agent-only build.
[[example]]
name = "coordinator_fixture"
required-features = ["server"]

# Namespace fixture for the seam C relay proof (scripts/mesh-relay-proof.py).
[[example]]
name = "relay_fixture"
required-features = ["relay", "test-support"]
