# Mesh coordinator and future node component share one removable plugin [198,201].
[package]
name = "infraternal-plugin-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server", "mesh-dns"]
server = ["dep:uuid", "dep:tracing", "dep:url", "dep:nix", "dep:libc"]
ee = []
# Diagnostic stage logging is removable and never enabled by a shipping role.
cutoff-measure = ["nix?/time"]
agent = [
    "dep:nix",
    "dep:openssl",
    "dep:zeroize",
    "dep:gotatun",
    "dep:ipnetwork",
    "dep:security-framework",
    "dep:tracing",
    "dep:infraternal-linux-tun",
    "tokio/rt-multi-thread",
]
# Relayed pairs through the seam C shim and relay address observation [313].
relay = ["agent", "dep:socket2", "dep:infraternal-plugin-relay", "infraternal-plugin-relay/runtime", "infraternal-mesh/relay"]
# In-memory relay credentials are used by isolated protocol and namespace fixtures.
test-support = ["agent", "infraternal-plugin-relay?/test-support"]
# Hickory's wire types and DNS snapshot fields are shared by both mesh roles [D327, #266].
mesh-dns = ["dep:hickory-proto", "dep:url"]

[dependencies]
foldhash = "0.2"
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-protocol.workspace = true
infraternal-mesh = { version = "0.1.0", path = "../../infraternal-mesh" }
infraternal-linux-tun = { version = "0.1.0", path = "../../infraternal-linux-tun", optional = true }
infraternal-plugin-relay = { version = "0.1.0", path = "../relay", optional = true }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }

nix = { workspace = true, optional = true, features = ["net", "ioctl", "poll", "time", "uio"] }
# Already in the binary through tokio with these features; used for the seam's
# raw send socket and its classic BPF packet tap [313].
socket2 = { version = "0.6", optional = true, features = ["all"] }
openssl = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
hickory-proto = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Both node platforms use the same pinned source to keep Nix vendoring unambiguous (D352).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# ring remains the one crypto backend (D289).
# The pinned fork commit (#260) runs receive batches inline on macOS by default
# (GOTATUN_BENCH_RX_INLINE_MAX=0 turns that off; Linux keeps it off). Connected
# per-endpoint sends (S) on macOS are on by default (owner, 2026-11-21, after
# J1108 on #260); GOTATUN_BENCH_MAC_CONNECTED=0 turns them off. The node passes
# that choice to the engine's socket factory and starts the route listener with
# it. The pool shares the WireGuard port only inside one audited startup window;
# where the kernel's socket list cannot prove nobody joined (macOS 27 shows a
# program only its own sockets), the engine opens no window and keeps sendto. A
# refused or failing connected send falls back to sendto and never loses the
# datagram. With S off, the Mac binds the WireGuard port as two exclusive
# sockets, AF_INET and IPv6-only, so no other local user can bind beside it
# before or after start (#260, J826, J834). A port another socket already holds
# is refused (EADDRINUSE), the same as a port taken outright. On macOS 14+ runs
# of datagrams leave through the private
# sendmsg_x and, from 15.6, arrive through recvmsg_x, on every socket where that
# measured faster; both are looked up at run time and fall back to one datagram
# per call. GOTATUN_MAC_BATCH=off turns them off (#554, J1036).
# On Linux, crypto runs of up to 48 packets are sealed or opened on the task that
# read them; only full 64-packet chunks go to a crypto worker. That removes
# 12-30% of futex calls per Gbit at unchanged throughput (#260, J1121).
# UDP GRO datagrams are cut into packets in place, without a copy, and the TUN
# sender merges runs already queued into one write run. With the adapter's
# gather writes that is +10-21% Gbit/s at 9-14% less CPU per Gbit (#260, J1129).
# Pure TCP ACKs, small packets and small encrypted datagrams go ahead of bulk data
# in the send path by default. Loaded median: -0.05..-0.39 ms for pings and
# -0.03..-0.24 ms for keystroke-sized TCP round trips, with Gbit/s within 0.3%.
# GOTATUN_REPLIES_FIRST=off turns it off (#260, J1143).
# The manifest no longer lists a cdylib, so an iOS static build of a crate that only
# depends on GotaTun needs no iOS linker (#580, J1173).
# Idle timer wakeups dropped to 0.000/s at 1 and 1,000 peers (event-driven netlink
# MTU watcher, CLOCK_BOOTTIME timerfd without 1 s poll/10 s sweep, activity-armed
# idle release), and idle release reclaims consumed receive-chunk prefixes and
# drops retired chunks (#260, D81, D331, J1150).
# Data packets with a small payload carry a mark in a reserved header byte when
# they leave a peer's second (side) UDP socket; a marked packet never moves the
# peer's endpoint, so the peer keeps sending to the main port. The sender side is
# off unless GOTATUN_SIDE_SOCKET=1 (bench). Shipping the receive rule first lets a
# later release turn the sender on without an older node roaming to a side port
# (#260, J1159).
# The device-level switch (`DeviceBuilder::with_side_socket`), the per-peer opt-in
# (`Peer::with_side_port`), the factory's `bind_side` and a listener on the side
# socket let the node turn the sender on for peers that advertise the receive rule
# (#260, J1211).
# A device backs off retries to peers only keepalives wait for, signals
# confirmed-endpoint changes and sends many initiations without waiting
# (#260, J1253, D81).
# On Linux the UDP sockets are registered with tokio for readability only; a send
# watches writability only while it is blocked on a full send buffer. Before, the
# kernel's write-space report after every datagram sent woke the parked engine
# worker: 82-94% of an idle hub's wakeups (#260, J1255, D81).
# Exact host routes use a seeded cache rebuilt from the allowed-IP trie (#260, J1266).
# Retry the first unanswered active handshake in the next admission window, and
# clear a peer's confirmed endpoint when its last session expires, resets, or
# rotates keys (#260, J1265).
# Deferring the initial timer-queue report in `DeviceState::add_peer` until after
# `Arc::new_cyclic` and `packet_lookup.insert_peer` keeps dynamically added peers from
# being dropped from `timer_queue` permanently (#605, J1299).
gotatun = { version = "0.10.3", git = "https://github.com/kaygdotorg/gotatun", rev = "8d00d0116fdf721fa76274c454467d92967ce4ce", default-features = false, features = ["device", "ring"], optional = true }
ipnetwork = { version = "0.21.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Both underlay coalescing suites test the schedule with a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# Namespace tests run each node on a thread that entered its own network namespace (D332).
nix = { workspace = true, features = ["net", "sched"] }
socket2 = { version = "0.6", features = ["all"] }

# Keep unsafe denied by default while allowing the documented macOS sysctl boundary.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# D351: review behaviour and cohesion instead of arbitrary item dimensions.
too_many_lines = "allow"
too_many_arguments = "allow"
unwrap_used = "deny"
expect_used = "deny"

# The production-schema proof needs coordinator storage, never an agent-only build.
[[example]]
name = "coordinator_fixture"
required-features = ["server"]

# Namespace fixture for the seam C relay proof (scripts/mesh-relay-proof.py).
[[example]]
name = "relay_fixture"
required-features = ["relay", "test-support"]

# Userspace key-echo through relayed pairs, for relay-choice measurements (#201, J1105).
[[example]]
name = "relay_echo"
required-features = ["relay", "test-support"]
