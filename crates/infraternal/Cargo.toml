# The one-binary CLI package for server and host-agent modes.
[package]
name = "infraternal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
infraternal-plugin-release = { path = "../plugins/release", version = "0.1.0", optional = true, default-features = false, features = ["server"] }
sqlx = { workspace = true, optional = true }
clap = { workspace = true, features = ["string"] }
tracing = { workspace = true, optional = true }
infraternal-plugin-remote = { path = "../plugins/remote", version = "0.1.0", optional = true, default-features = false }
infraternal-plugin-api = { path = "../infraternal-plugin-api", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
infraternal-server = { path = "../infraternal-server", version = "0.1.0", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
infraternal-shim.workspace = true
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false, optional = true }
infraternal-mesh = { path = "../infraternal-mesh", version = "0.1.0", optional = true }
infraternal-plugin-ssh = { path = "../plugins/ssh", version = "0.1.0", optional = true }
infraternal-plugin-relay = { path = "../plugins/relay", version = "0.1.0", optional = true }
infraternal-plugin-backup = { path = "../plugins/backup", version = "0.1.0", optional = true }
thiserror.workspace = true
base64 = { workspace = true, optional = true }
bytes.workspace = true
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
nix.workspace = true
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true

infraternal-plugin-host-facts = { path = "../plugins/host-facts", version = "0.1.0", optional = true }
infraternal-plugin-mesh = { path = "../plugins/mesh", version = "0.1.0", optional = true }

[features]
# Per-run test authority is compiled only into explicit staging images (#188 D1).
staging-trust = ["plugin-server", "infraternal-server/staging-trust"]
release = ["plugin-server", "infraternal-server/release", "dep:infraternal-plugin-release", "dep:sqlx"]
remote = ["plugin-agent", "dep:tokio","dep:tracing", "infraternal-agent/remote", "infraternal-server?/remote", "dep:infraternal-plugin-remote", "infraternal-plugin-remote/agent", "dep:base64", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:openssl", "dep:tokio-openssl", "dep:url"]
ssh = ["plugin-ssh", "infraternal-server?/ssh"]
default = ["release", "remote", "ssh", "plugin-host-facts", "plugin-agent", "plugin-backup", "plugin-mesh", "plugin-relay", "plugin-server", "plugin-ssh"]
plugin-agent = ["dep:infraternal-agent", "dep:tokio"]
plugin-backup = ["dep:infraternal-plugin-backup"]
plugin-mesh = ["dep:infraternal-mesh", "dep:infraternal-plugin-mesh", "infraternal-server?/mesh", "plugin-agent", "infraternal-agent/mesh", "dep:tokio"]
# Preserve the production feature name without enabling a server role.
mesh = ["plugin-mesh"]
ee = ["infraternal-server?/ee", "infraternal-agent?/ee"]
plugin-host-facts = ["plugin-agent", "dep:infraternal-plugin-host-facts", "infraternal-agent/plugin-host-facts"]
plugin-relay = ["dep:infraternal-plugin-relay"]
plugin-server = ["dep:infraternal-server", "infraternal-server/cli-plugin", "infraternal-plugin-remote?/server", "dep:tokio"]
plugin-ssh = ["dep:infraternal-plugin-ssh"]

[lints]
workspace = true

[dev-dependencies]
nix.workspace = true
tokio.workspace = true
vt100.workspace = true
