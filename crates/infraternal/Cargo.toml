# The one-binary CLI package for server and host-agent modes.
[package]
name = "infraternal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
remote = ["dep:tracing", "infraternal-agent/remote", "infraternal-server/remote", "dep:infraternal-plugin-remote", "infraternal-plugin-remote/agent", "infraternal-plugin-remote/server", "dep:base64", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:openssl", "dep:tokio-openssl", "dep:url"]
default = ["plugin-host-facts", "mesh", "remote", "ssh"]
plugin-host-facts = ["infraternal-agent/plugin-host-facts"]
mesh = ["infraternal-server/mesh"]

ssh = ["dep:infraternal-plugin-ssh", "infraternal-server/ssh"]

[dependencies]
tracing = { workspace = true, optional = true }
infraternal-plugin-ssh = { path = "../plugins/ssh", version = "0.1.0", optional = true }

infraternal-plugin-remote = { path = "../plugins/remote", version = "0.1.0", optional = true, default-features = false }
clap = { workspace = true, features = ["string"] }
infraternal-server = { path = "../infraternal-server", version = "0.1.0", default-features = false }
sqlx.workspace = true
tokio.workspace = true
infraternal-shim.workspace = true
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false }
thiserror.workspace = true
base64 = { workspace = true, optional = true }
bytes.workspace = true
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
nix.workspace = true
openssl = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio-openssl = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
vt100.workspace = true
