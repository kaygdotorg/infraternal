# The one-binary CLI package for server and host-agent modes.
[package]
name = "infraternal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["mesh"]
mesh = ["infraternal-server/mesh"]

[dependencies]
clap.workspace = true
infraternal-server = { path = "../infraternal-server", version = "0.1.0", default-features = false }
