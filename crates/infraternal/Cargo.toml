# The one-binary CLI package for server and host-agent modes.
[package]
name = "infraternal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
infraternal-plugin-desktop = { path = "../plugins/desktop", version = "0.1.0", default-features = false, optional = true }
infraternal-plugin-release = { path = "../plugins/release", version = "0.1.0", optional = true, default-features = false, features = ["server"] }
sqlx = { workspace = true, optional = true }
clap = { workspace = true, features = ["string"] }
tracing = { workspace = true, optional = true }
infraternal-plugin-remote = { path = "../plugins/remote", version = "0.1.0", optional = true, default-features = false }
infraternal-plugin-api = { path = "../infraternal-plugin-api", version = "0.1.0" }
infraternal-status = { path = "../infraternal-status", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
infraternal-server = { path = "../infraternal-server", version = "0.1.0", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
# Executable images use only the audited callback-free Rust VT boundary (D243).
infraternal-shim = { workspace = true, features = ["session-image", "cli"] }
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false, optional = true }
infraternal-mesh = { path = "../infraternal-mesh", version = "0.1.0", optional = true }
infraternal-plugin-ssh = { path = "../plugins/ssh", version = "0.1.0", optional = true, features = ["session-bridge"] }
infraternal-plugin-relay = { path = "../plugins/relay", version = "0.1.0", optional = true }
infraternal-plugin-backup = { path = "../plugins/backup", version = "0.1.0", optional = true }
thiserror.workspace = true
base64 = { workspace = true, optional = true }
bytes.workspace = true
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
nix = { workspace = true, features = ["resource"] }
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid.workspace = true

infraternal-plugin-host-facts = { path = "../plugins/host-facts", version = "0.1.0", optional = true }
infraternal-plugin-mesh = { path = "../plugins/mesh", version = "0.1.0", optional = true }
infraternal-plugin-proxy = { path = "../plugins/proxy", version = "0.1.0", optional = true }

# Only the terminal QR code of `infraternal up` (#263) is Linux-only; the plugin
# dependencies above stay on every platform.
[target.'cfg(target_os = "linux")'.dependencies]
qrcodegen = { version = "1.8.0", optional = true }

[features]
# App windows are compiled only for an explicit desktop build (#146).
desktop = ["plugin-agent", "infraternal-agent/desktop", "plugin-server", "dep:infraternal-plugin-desktop", "infraternal-plugin-desktop/desktop", "infraternal-server/desktop"]
# Opt-in research host; production still launches one shim per session.
process-per-user = ["infraternal-shim/process-per-user"]
# Numeric-only reactor instrumentation; excluded from uninstrumented measurements.
host-diagnostics = ["process-per-user", "infraternal-shim/host-diagnostics"]
compact-history = ["process-per-user", "infraternal-shim/compact-history"]
# Per-run test authority is compiled only into explicit staging images (#188 D1).
staging-trust = ["plugin-server", "infraternal-server/staging-trust"]
release = ["plugin-server", "infraternal-server/release", "dep:infraternal-plugin-release", "dep:sqlx"]
remote = ["infraternal-shim/ca-handoff", "plugin-agent", "dep:tokio","dep:tracing", "infraternal-agent/remote", "infraternal-server?/remote", "dep:infraternal-plugin-remote", "infraternal-plugin-remote/agent", "dep:base64", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:openssl", "dep:qrcodegen", "dep:tokio-openssl", "dep:url", "dep:zeroize"]
# Private SSH session routes need the host runtime even when its operator role is absent.
ssh = ["plugin-ssh", "dep:infraternal-agent", "dep:tokio", "infraternal-server?/ssh"]
# Private release profile for the early shim/SSH startup image.
session-payload = ["ssh"]
canvas = ["plugin-server", "infraternal-server/canvas"]
default = ["canvas", "release", "remote", "ssh", "plugin-host-facts", "plugin-agent", "plugin-backup", "plugin-mesh", "plugin-proxy", "plugin-relay", "plugin-server", "plugin-ssh"]
plugin-agent = ["dep:infraternal-agent", "dep:tokio", "tokio/rt-multi-thread"]
plugin-backup = ["dep:infraternal-plugin-backup"]
plugin-mesh = ["dep:infraternal-mesh", "dep:infraternal-plugin-mesh", "infraternal-server?/mesh", "plugin-agent", "infraternal-agent/mesh", "dep:tokio"]
plugin-proxy = ["dep:infraternal-plugin-proxy", "plugin-agent", "infraternal-agent/proxy", "infraternal-server?/proxy"]
# Preserve the production feature name without enabling a server role.
mesh = ["plugin-mesh"]
ee = ["infraternal-server?/ee", "infraternal-agent?/ee"]
plugin-host-facts = ["plugin-agent", "dep:infraternal-plugin-host-facts", "infraternal-agent/plugin-host-facts"]
plugin-relay = ["dep:infraternal-plugin-relay"]
plugin-server = ["dep:infraternal-server", "infraternal-server/cli-plugin", "infraternal-plugin-remote?/server", "dep:tokio"]
plugin-ssh = ["dep:infraternal-plugin-ssh"]
# Also compile the hidden commands of components that are not built yet (D299 C5); the
# D16 one-source tests need them. Off by default: their text costs binary size (D243).
placeholders = ["infraternal-plugin-api/placeholders"]

[lints]
workspace = true

[dev-dependencies]
nix.workspace = true
tokio.workspace = true
vt100.workspace = true
