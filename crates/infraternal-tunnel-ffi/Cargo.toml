[package]
name = "infraternal-tunnel-ffi"
description = "UniFFI surface for the iOS packet tunnel extension (#580)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
base64.workspace = true
infraternal-link = { path = "../infraternal-link", features = ["quic", "join"] }
quinn.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
uniffi.workspace = true
uuid.workspace = true

[lints]
workspace = true
