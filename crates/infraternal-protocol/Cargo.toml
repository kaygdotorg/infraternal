# The shared wire-protocol package for browser, server, and host-agent links.
[package]
name = "infraternal-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The negotiated app-window extension is absent from terminal-only production images.
desktop = []

[[example]]
name = "stream_oracle"
required-features = ["desktop"]

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "wire_codec"
harness = false

[lints]
workspace = true
