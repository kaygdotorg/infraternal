# The trusted control-plane package for identity, state, API, and routing.
[package]
name = "infraternal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Development-only bounded parser corpus entrypoint; absent from shipping builds.
parser-checks = []
# A host without global plugin workers keeps socket-scoped lifecycle only.
global-work = ["infraternal-plugin-api/global-work"]
# Generic plugin media lanes stay absent from terminal-only builds (#146).
native-streams = ["global-work", "remote", "infraternal-agent/native-streams", "infraternal-plugin-remote/native-streams"]
# App-window routing reuses the enrolled-host transport [D198,D232].
desktop = ["native-streams", "remote", "dep:infraternal-plugin-desktop", "infraternal-plugin-desktop/server"]
staging-trust = []
default = ["mesh", "proxy", "cli-plugin", "ssh", "release", "canvas"]
canvas = ["dep:infraternal-plugin-canvas"]
cli-plugin = []
mesh = ["dep:infraternal-plugin-mesh", "infraternal-plugin-mesh/mesh-dns"]
proxy = ["infraternal-agent/proxy"]
# Opt-in namespace proof compiles the existing node engine in this test process.
mesh-transport-proof = ["mesh", "remote", "infraternal-agent/mesh", "infraternal-plugin-mesh/test-support", "infraternal-plugin-remote/test-support"]
ee = ["infraternal-plugin-mesh?/ee", "infraternal-agent/ee"]
remote = ["infraternal-shim/ca-handoff", "dep:infraternal-plugin-remote", "infraternal-plugin-remote/server", "infraternal-agent/remote", "dep:quinn", "dep:hyper", "dep:hyper-util", "dep:tokio-tungstenite", "dep:infraternal-link", "infraternal-link/quic"]

ssh = ["dep:infraternal-plugin-ssh", "dep:hyper", "dep:hyper-util", "dep:tokio-openssl", "dep:http-body-util"]

release = ["dep:infraternal-plugin-release", "dep:hyper", "dep:hyper-util", "dep:tokio-openssl", "dep:http-body-util", "infraternal-plugin-api/tls-roots"]

[dependencies]
base16ct.workspace = true
infraternal-plugin-desktop = { path = "../plugins/desktop", version = "0.1.0", default-features = false, optional = true }
infraternal-plugin-canvas = { path = "../plugins/canvas", version = "0.1.0", optional = true }
infraternal-shim = { path = "../infraternal-shim", version = "0.1.0", default-features = false }
infraternal-plugin-release = { path = "../plugins/release", version = "0.1.0", optional = true, default-features = false, features = ["server"] }
# The release downloader reuses the HTTP/TLS engines already used by server tests.
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
httpdate = "1.0.3"
infraternal-plugin-ssh = { path = "../plugins/ssh", version = "0.1.0", optional = true }
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-plugin-remote = { path = "../plugins/remote", version = "0.1.0", optional = true, default-features = false }
argon2.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
bip39.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor_2.workspace = true
sha2.workspace = true
socket2 = { version = "0.6", features = ["all"] }
zeroize.workspace = true
sqlx.workspace = true
# D379 (#473): the rusqlite pool. Slice 2 runs the session statements on it; the rest still uses sqlx.
infraternal-db = { path = "../infraternal-db", version = "0.1.0" }
infraternal-sign-in = { path = "../infraternal-sign-in", version = "0.1.0" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
# The update quiet window reads the coarse monotonic clock (#211 S4).
nix = { workspace = true, features = ["time"] }
infraternal-protocol.workspace = true
infraternal-plugin-mesh = { version = "0.1.0", path = "../plugins/mesh", optional = true, default-features = false, features = ["server"] }
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
openssl.workspace = true
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false }
quinn = { workspace = true, optional = true }
# `/remote/agent` owns its WebSocket so it can cap reads before the host proof
# (#572); the embedded infraternal agent already links this version.
tokio-tungstenite = { workspace = true, optional = true }
# The device link's close codes are shared with the client that reads them
# (#580); the embedded infraternal agent already links this crate with QUIC.
infraternal-link = { workspace = true, optional = true }

# Reuse the pinned digest for original migration checksums in generated build data [243].
[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# A second P-256 implementation signs test requests, so the server's OpenSSL
# verifier is checked against the encoding the client core produces (#580).
ring.workspace = true
# The iPhone's link client, with a software P-256 key in place of the Secure
# Enclave, joins and links against the real server in tests (#580, L3).
infraternal-link = { workspace = true, features = ["quic", "join", "test-support"] }
# Frozen extension vectors remain covered without adding them to shipping terminals.
infraternal-protocol = { workspace = true, features = ["desktop"] }
# Native-lane regressions opt in explicitly; shipping remote terminals do not.
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false, features = ["native-streams"] }
hyper.workspace = true
hyper-util.workspace = true
tokio-openssl.workspace = true
tokio = { workspace = true, features = ["test-util"] }
aes-gcm.workspace = true
hkdf.workspace = true
nix = { workspace = true, features = ["time"] }
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
# Exercise the existing server HTTP/2 and OpenSSL stack over real TLS in auth tests.
h2 = "0.4"

[[example]]
name = "remote_ca_bench"
required-features = ["remote"]

[[example]]
name = "mesh_revocation_fixture"
required-features = ["remote", "mesh"]

[[example]]
name = "layout_bench"
required-features = ["canvas"]
