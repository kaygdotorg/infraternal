# The trusted control-plane package for identity, state, API, and routing.
[package]
name = "infraternal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["mesh", "cli-plugin"]
cli-plugin = []
mesh = ["dep:infraternal-plugin-mesh"]

[dependencies]
argon2.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
bip39.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor_2.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
nix.workspace = true
infraternal-protocol.workspace = true
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-plugin-mesh = { version = "0.1.0", path = "../plugins/mesh", optional = true, default-features = false, features = ["server"] }
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
openssl.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
aes-gcm.workspace = true
hkdf.workspace = true
nix = { workspace = true, features = ["time"] }
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
