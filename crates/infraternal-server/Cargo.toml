# The trusted control-plane package for identity, state, API, and routing.
[package]
name = "infraternal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
staging-trust = []
default = ["mesh", "cli-plugin", "ssh", "release"]
cli-plugin = []
mesh = ["dep:infraternal-plugin-mesh"]
# Opt-in namespace proof compiles the existing node engine in this test process.
mesh-transport-proof = ["mesh", "remote", "infraternal-agent/mesh"]
ee = ["infraternal-plugin-mesh?/ee", "infraternal-agent/ee"]
remote = ["infraternal-shim/ca-handoff", "dep:infraternal-plugin-remote", "infraternal-plugin-remote/server", "infraternal-agent/remote", "dep:quinn"]

ssh = ["dep:infraternal-plugin-ssh", "dep:hyper", "dep:hyper-util", "dep:tokio-openssl", "dep:http-body-util"]

release = ["dep:infraternal-plugin-release", "dep:hyper", "dep:hyper-util", "dep:tokio-openssl", "dep:http-body-util"]

[dependencies]
infraternal-shim = { path = "../infraternal-shim", version = "0.1.0", default-features = false }
infraternal-plugin-release = { path = "../plugins/release", version = "0.1.0", optional = true, default-features = false, features = ["server"] }
# The release downloader reuses the HTTP/TLS engines already used by server tests.
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
infraternal-plugin-ssh = { path = "../plugins/ssh", version = "0.1.0", optional = true }
infraternal-plugin-api = { workspace = true, features = ["socket-host"] }
infraternal-plugin-remote = { path = "../plugins/remote", version = "0.1.0", optional = true, default-features = false }
argon2.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
bip39.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor_2.workspace = true
sha2.workspace = true
zeroize.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
nix.workspace = true
infraternal-protocol.workspace = true
infraternal-plugin-mesh = { version = "0.1.0", path = "../plugins/mesh", optional = true, default-features = false, features = ["server"] }
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
openssl.workspace = true
infraternal-agent = { path = "../infraternal-agent", version = "0.1.0", default-features = false }
quinn = { workspace = true, optional = true }

[dev-dependencies]
hyper.workspace = true
hyper-util.workspace = true
tokio-openssl.workspace = true
tokio = { workspace = true, features = ["test-util"] }
aes-gcm.workspace = true
hkdf.workspace = true
nix = { workspace = true, features = ["time"] }
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
# Exercise the existing server HTTP/2 and OpenSSL stack over real TLS in auth tests.
h2 = "0.4"

[[example]]
name = "remote_ca_bench"
required-features = ["remote"]
