# Reads a node's role and component states from its unit files and data directories (#237).
[package]
name = "infraternal-status"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
infraternal-mesh = { path = "../infraternal-mesh", version = "0.1.0", optional = true }
nix = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
zeroize.workspace = true

[features]
mesh = ["dep:infraternal-mesh"]

[target.'cfg(target_os = "linux")'.dependencies]
infraternal-shim.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["net"] }

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
