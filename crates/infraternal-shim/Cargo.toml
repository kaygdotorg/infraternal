# The small process that will own a PTY session across agent restarts.
[package]
name = "infraternal-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo does not allow a member to inherit workspace lints and override one
# inherited level, so this exception repeats the workspace Clippy policy.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
alacritty_terminal = { workspace = true, optional = true }
vte.workspace = true
nix.workspace = true

vt100 = { workspace = true, optional = true }

# Comparison engines are never in the default production dependency graph.
[features]
# Audited transient process-transfer buffers are removed with the remote plugin.
ca-handoff = []
bench-vt = ["dep:alacritty_terminal", "dep:vt100"]
bench-ghostty = ["bench-vt", "dep:libghostty-vt"]

[dependencies.libghostty-vt]
workspace = true
optional = true

# The old engines are retained only for reproducible comparison measurements.
[[example]]
name = "vt_compare"
required-features = ["bench-vt"]
