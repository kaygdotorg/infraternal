# The small process that will own a PTY session across agent restarts.
[package]
name = "infraternal-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo does not allow a member to inherit workspace lints and override one
# inherited level, so this exception repeats the workspace Clippy policy.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
clap = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }
vte.workspace = true
# Reuse the server's pinned OpenSSL at the audited secure-allocation FFI boundary.
openssl = { workspace = true, optional = true }
nix.workspace = true
tokio = { workspace = true, optional = true, features = ["net"] }

vt100 = { workspace = true, optional = true }

# Comparison engines are never in the default production dependency graph.
[features]
# Audited owned readiness registration, absent from standalone PTY builds.
async-fd = ["dep:tokio", "nix/inotify", "nix/event"]
cli = ["dep:clap"]
# Executable images expose the callback-free Rust VT boundary only (D243).
session-image = []
# Research-only shared-process reactor; never selected by production defaults.
process-per-user = ["nix/uio", "nix/event"]
# Numeric stage tracing changes scheduling; excluded from all admission builds.
host-diagnostics = ["process-per-user"]
# Research-only exact cold-history representation; measured before adoption.
compact-history = ["process-per-user"]
# Private host-login workers and descriptor transfers compile out with host work.
host-login = ["nix/uio"]
# Audited transient process-transfer buffers are removed with the remote plugin.
ca-handoff = ["dep:openssl"]
bench-vt = ["dep:alacritty_terminal", "dep:vt100"]
bench-ghostty = ["bench-vt", "dep:libghostty-vt"]

[dependencies.libghostty-vt]
workspace = true
optional = true

# The old engines are retained only for reproducible comparison measurements.
[[example]]
name = "vt_compare"
required-features = ["bench-vt"]

# Real lifecycle fixtures need a single-threaded main, not the test harness.
[[example]]
name = "ppu_host_fixture"
required-features = ["process-per-user"]

# Native observers keep probe CPU independent of the workload driver.
[[example]]
name = "ppu_wire_probe"
required-features = ["process-per-user"]
