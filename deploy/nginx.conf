pid /tmp/nginx.pid;

worker_processes 1;

events {
    worker_connections 128;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Compress first-party text at the maintained edge.  Responses that the
    # backend already encoded (including its cached API gzip variant) pass
    # through with their existing Content-Encoding header and are not doubled.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    log_format status '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout status;
    error_log /dev/stderr warn;

    # The application accepts only small, fixed GET/HEAD requests.  These
    # limits also cover malformed requests before they reach Python.
    client_max_body_size 32k;
    client_body_buffer_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 20s;
    keepalive_requests 100;
    send_timeout 15s;
    reset_timedout_connection on;

    # A TLS ingress can collapse all visitors to one source address. These
    # bounds therefore accommodate aggregate traffic; enforce end-user limits
    # at the trusted outer edge without trusting arbitrary forwarded headers.
    limit_req_zone $binary_remote_addr zone=status_req:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=status_conn:10m;

    proxy_temp_path /tmp/proxy_temp 1 2;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_body_temp_path /tmp/client_temp 1 2;

    upstream status_app {
        server app:8080;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        server_name _;

        limit_req zone=status_req burst=200 nodelay;
        limit_conn status_conn 48;
        limit_req_status 429;
        limit_conn_status 429;

        # The public service is read-only. Reject body framing before a request
        # reaches the Python handler; client_max_body_size still bounds a
        # malformed or oversized request before this rule is evaluated.
        if ($request_method !~ ^(?:GET|HEAD)$) {
            return 405;
        }
        if ($content_length != "") {
            return 400;
        }
        if ($http_transfer_encoding != "") {
            return 400;
        }

        # Apply the same bounded upstream policy to every allowed route.  The
        # response headers generated by status_api.py, including CSP, are
        # passed through unchanged.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 25s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 4 16k;
        proxy_intercept_errors off;

        # The app owns these same-origin routes.  Exact matches keep the
        # public surface explicit while still allowing the frontend's client
        # routes and static assets below.
        location = /healthz {
            proxy_pass http://status_app;
        }

        location = /readyz {
            proxy_pass http://status_app;
        }

        location = /config.json {
            proxy_pass http://status_app;
        }

        location = /api/v1/config {
            proxy_pass http://status_app;
        }

        location = /api/v1/status {
            proxy_pass http://status_app;
        }

        # Never turn this proxy into a generic API, metrics, probe, config, or
        # Grafana proxy.  The app also rejects these routes independently.
        location ~ ^/(?:api|config|metrics|probe|grafana)(?:/|$) {
            return 404;
        }

        location / {
            proxy_pass http://status_app;
        }
    }
}
