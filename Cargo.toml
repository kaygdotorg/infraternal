# Virtual workspace manifest for the Rust pieces of infraternal.
[workspace]
resolver = "3"
members = [
    "fuzz",
    "crates/infraternal-mesh",
    "crates/infraternal",
    "crates/infraternal-protocol",
    "crates/infraternal-plugin-api",
    "crates/infraternal-server",
    "crates/infraternal-agent",
    "crates/infraternal-shim",
    "crates/infraternal-session",
    "crates/infraternal-status",
    "crates/plugins/ssh",
    "crates/plugins/relay",
    "crates/plugins/backup",
    "crates/plugins/canvas",
    "crates/plugins/host-facts",
    "crates/plugins/mesh",
    "crates/plugins/remote",
    "crates/plugins/release",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
infraternal-plugin-api = { version = "0.1.0", path = "crates/infraternal-plugin-api" }
argon2 = "0.5"
# Retain the server's HTTP, JSON, WebSocket and tracing paths; the form, query,
# matched-path and original-URI extractors are not used [#198].
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tower-log", "tracing", "ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-openssl"] }
bytes = "1"
base64 = "0.22"
bip39 = { version = "2.2", features = ["rand"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1.9", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
# Each role enables its required scheduler; private session images use only the current-thread runtime.
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "signal", "time", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["conditional-ui"] }
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
# The native QUIC provider already includes this exact HMAC implementation.
ring = { version = "0.17.14", default-features = false }
aes-gcm = "0.10"
hkdf = "0.12"
serde_cbor_2 = "0.13"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
libghostty-vt = { version = "0.2.2", default-features = false }
libfuzzer-sys = "0.4"
vt100 = "0.16"
vte = "0.15"
alacritty_terminal = "0.25"
nix = { version = "0.30", features = ["fs", "term", "process", "signal", "user", "socket", "poll", "hostname"] }
infraternal-shim = { version = "0.1.0", path = "crates/infraternal-shim" }
infraternal-protocol = { version = "0.1.0", path = "crates/infraternal-protocol" }
infraternal-server = { version = "0.1.0", path = "crates/infraternal-server" }
clap = { version = "4.5", features = ["derive", "string"] }
criterion = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Keep SSH prompt image hashing inside its fixed reply deadline in test and
# development builds; optimized release builds already use this code path.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding (the default). With panic = "abort", one bug in one session
# task would kill the whole server and every other user's connection. With
# unwinding, tokio isolates a panicking task. The cost is a slightly larger
# binary. That is acceptable (DECISIONS 5: measure; robustness here is worth
# a few hundred KiB).
panic = "unwind"

# Bound async orchestration code; Mesh and cryptographic dependencies retain speed optimization [5,198].
[profile.release.package.infraternal-server]
opt-level = "s"

# Keep management metadata and host-facts actions size-optimized; terminal and
# mesh data paths retain the speed profile [243].
[profile.release.package.infraternal-plugin-release]
opt-level = "s"

[profile.release.package.infraternal-plugin-host-facts]
opt-level = "s"

# Keep host orchestration compact; transport, protocol, VT and cryptographic
# crates retain their speed optimization. The measured minimum-size profile
# keeps the bounded terminal-query lane compact [5,243,307].
[profile.release.package.infraternal-agent]
opt-level = "z"

# SSH installation is management orchestration, outside terminal and mesh data
# paths; it is bounded by the external transport [243,255]. Lifetime-safe retry
# recovery fits its measured size only at z (#230).
[profile.release.package.infraternal-plugin-ssh]
opt-level = "z"

# `infraternal status` reads unit files once per call: size-optimized [243].
[profile.release.package.infraternal-status]
opt-level = "s"

# Layout control intents stay off the terminal data path; bound their new code footprint [243,248].
[profile.release.package.infraternal-plugin-canvas]
opt-level = "s"
